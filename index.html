    import { connect } from 'MP_SDK';

    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwwg0RPJ7JVDc2n0Yxz1UbNGBeiB7cuI3oO9WxuL3N89UK_E-_m_rpkr9PYnB9Xpyes/exec"

    let studentInfo = {
  studentName: "",
  studentId: ""
};

document.getElementById("studentGateForm")
  .addEventListener("submit", (event) => {
    event.preventDefault();

    const studentName =
      document.getElementById("studentName").value.trim();

    const studentId =
      document.getElementById("studentId").value.trim();

    if (!studentName || !studentId) {
      document.getElementById("studentGateError").textContent =
        "氏名と学籍番号を入力してください。";
      return;
    }

    studentInfo = {
      studentName,
      studentId
    };

    document.getElementById("studentGate").style.display = "none";

    // 利用者情報が入力された後にMatterportを起動
    connectSdk();
  });

    async function connectSdk() {

      const iframe = document.getElementById('showcase-iframe');

      try {

        const mpSdk = await connect(iframe);

        const questions = [
  {
    question: "金沢工業大学２号館の構造は？",
    answers: ["木造", "鉄筋コンクリート造", "鉄骨造"],
    correct: 1,
    nextSweep: "ifhi11ih500zxbpyyxbn78u2b",
    explanationSweep: "ifhi11ih500zxbpyyxbn78u2b"
  },

  {
    question: "金沢工業大学２号館の竣工時期は？",
    answers: ["1959", "1969", "1979"],
    correct: 1,
    nextSweep: "ha59ay42rqzmxznw7cfwq3nnc",
    explanationSweep: "ha59ay42rqzmxznw7cfwq3nnc"
  },

  {
    question: "金沢市にある有名な美術館は？",
    answers: ["21世紀美術館", "国立西洋美術館", "森美術館"],
    correct: 0,
    nextSweep: "ここに3問目のSweep ID",
    explanationSweep: "ここに3問目のSweep ID"
  }
];
let currentQuestion = 0;
let correctCount = 0;
let answerResults = [];
let detailedAnswers = [];

function showQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("question").textContent =
    "Q. " + q.question;

  document.getElementById("answerA").textContent =
    "A：" + q.answers[0];

  document.getElementById("answerB").textContent =
    "B：" + q.answers[1];

  document.getElementById("answerC").textContent =
    "C：" + q.answers[2];

  document.getElementById("result").textContent = "";
}
function answer(selectedAnswer) {
  const q = questions[currentQuestion];
  const isCorrect = selectedAnswer === q.correct;

  if (isCorrect) {
    document.getElementById("result").textContent = "正解！🎉";
    correctCount++;
    answerResults.push("○");
  } else {
    document.getElementById("result").textContent = "不正解！";
    answerResults.push("×");
  }

  // 問題ごとの回答データを記録
  detailedAnswers.push({
    questionText: q.question,
    selectedAnswer: q.answers[selectedAnswer],
    correctAnswer: q.answers[q.correct],
    isCorrect: isCorrect
  });

  // 回答ボタンを隠す
  document.getElementById("answerA").style.display = "none";
  document.getElementById("answerB").style.display = "none";
  document.getElementById("answerC").style.display = "none";

  // 次の操作を表示
  document.getElementById("nextChoice").style.display = "block";
}

document.getElementById("nextQuestionButton").addEventListener("click", () => {

  currentQuestion++;

  if (currentQuestion < questions.length) {

    // 選択肢を隠す
    document.getElementById("nextChoice").style.display = "none";

    // 回答ボタンを再表示
    document.getElementById("answerA").style.display = "block";
    document.getElementById("answerB").style.display = "block";
    document.getElementById("answerC").style.display = "block";

    // 次の問題を表示
    showQuestion();

  } else {

    document.getElementById("question").textContent =
      "クイズ終了！";

    document.getElementById("nextChoice").style.display = "none";
  }

});

document.getElementById("answerA").addEventListener("click", () => {
  answer(0);
});

document.getElementById("answerB").addEventListener("click", () => {
  answer(1);
});

document.getElementById("answerC").addEventListener("click", () => {
  answer(2);
});

document.getElementById("explanationButton").addEventListener("click", () => {

  const q = questions[currentQuestion];

  mpSdk.Sweep.moveTo(q.explanationSweep, {});

});


// 「テスト表示」を押したとき
document.getElementById("testButton").addEventListener("click", () => {

  currentQuestion = 0;
   correctCount = 0;
  answerResults = [];
  detailedAnswers = [];

  document.getElementById("quiz").style.display = "block";

  document.getElementById("answerA").style.display = "block";
  document.getElementById("answerB").style.display = "block";
  document.getElementById("answerC").style.display = "block";

  document.getElementById("nextChoice").style.display = "none";

  showQuestion();

});


// 「テスト終了」を押したとき
document.getElementById("endTestButton").addEventListener("click", () => {

  // クイズを隠す
  document.getElementById("quiz").style.display = "none";

  // 回答した問題数
  const totalQuestions = answerResults.length;

  // 正答率を計算
  const accuracy =
    totalQuestions > 0
      ? (correctCount / totalQuestions) * 100
      : 0;

  // 正解数を表示
  document.getElementById("score").textContent =
    "正解数　" + correctCount + " / " + totalQuestions + "問";

  // 正答率を表示
  document.getElementById("accuracy").textContent =
    "正答率　" + accuracy.toFixed(1) + "%";

  // 結果一覧を表示
  const resultsArea =
    document.getElementById("answerResults");

  resultsArea.innerHTML = "";

  answerResults.forEach((result, index) => {

    const p = document.createElement("p");

    p.textContent =
      "第" + (index + 1) + "問　" + result;

    resultsArea.appendChild(p);

  });

  if (detailedAnswers.length > 0) {
  const payload = {
    studentName: studentInfo.studentName,
    studentId: studentInfo.studentId,
    quizType: "メイン画面",
    answers: detailedAnswers
  };

  fetch(GAS_WEB_APP_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(payload)
  }).catch(error => {
    console.error("クイズ結果の送信エラー:", error);
  });
}

  // 結果画面を表示
  document.getElementById("resultScreen").style.display = "block";

});

document.getElementById("closeResultButton").addEventListener("click", () => {

  document.getElementById("resultScreen").style.display = "none";

});

    "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQo6wuZ0xxI2qZ_UF4O8bk7o2MGv68EFnbqR2tRB7c2iw&s=10",

const studentName = ${studentNameForSandbox};
const studentId = ${studentIdForSandbox};
const GAS_WEB_APP_URL = ${gasUrlForSandbox};
const questions = [
  {
    question: "第1問：この場所はどこの大学にあるでしょう？",
    options: ["金沢工業大学", "金沢大学", "富山大学"],
    answer: "A"
  },
  {
    question: "第2問：この場所は建物のどの部分でしょう？",
    options: ["屋上", "中二階", "地下"],
    answer: "B"
  },
  {
    question: "第3問：Matterportでは何ができるでしょう？",
    options: ["3D空間を見て回る", "建物を自動で建てる", "部屋の温度を変える"],
    answer: "A"
  }
];

let currentQuestion = 0;
let score = 0;
let answered = false;
let detailedAnswers = [];

function showQuestion() {
  const q = questions[currentQuestion];

  document.getElementById("quizQuestion").textContent = q.question;

  document.getElementById("quizOptions").innerHTML =
  q.options.map((option, i) =>
    '<label style="display:block; margin:10px 0;">' +
    '<input type="radio" name="quizAnswer" value="' +
    ["A", "B", "C"][i] + '">' +
    ["A", "B", "C"][i] + ". " + option +
    '</label>'
  ).join("");

  document.getElementById("quizResult").textContent = "";
  document.getElementById("checkQuiz").style.display = "inline-block";
  document.getElementById("checkQuiz").disabled = false;
  document.getElementById("nextQuiz").style.display = "none";

  answered = false;
}

document.getElementById("checkQuiz").addEventListener("click", () => {
  if (answered) return;

  const selected = document.querySelector(
    'input[name="quizAnswer"]:checked'
  );

  const result = document.getElementById("quizResult");

  if (!selected) {
    result.textContent = "選択肢を選んでね！";
    return;
  }

  answered = true;

  const q = questions[currentQuestion];
  const selectedIndex = ["A", "B", "C"].indexOf(selected.value);
  const correctIndex = ["A", "B", "C"].indexOf(q.answer);
  const isCorrect = selected.value === q.answer;

  detailedAnswers.push({
    questionText: q.question,
    selectedAnswer: q.options[selectedIndex],
    correctAnswer: q.options[correctIndex],
    isCorrect: isCorrect
  });

  if (isCorrect) {
    score++;
    result.textContent = "正解！🎉";
  } else {
    result.textContent = "不正解！";
  }

  document.getElementById("checkQuiz").disabled = true;
  document.getElementById("nextQuiz").style.display = "inline-block";

  document.getElementById("nextQuiz").textContent =
    currentQuestion === questions.length - 1
      ? "結果を見る"
      : "次の問題へ";
});

document.getElementById("nextQuiz").addEventListener("click", () => {
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    showQuestion();
  } else {
    document.getElementById("quizQuestion").textContent = "クイズ終了！";
    document.getElementById("quizOptions").innerHTML = "";
    document.getElementById("quizResult").textContent =
      questions.length + "問中 " + score + " 問正解！";

    document.getElementById("checkQuiz").style.display = "none";
    document.getElementById("nextQuiz").style.display = "none";

    if (detailedAnswers.length > 0) {
      const payload = {

});
